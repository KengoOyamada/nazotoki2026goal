<title>なぞ① の ヒント ── あおい炎のなぞ</title>
<style>
:root{--green:#2FA24B;--dgreen:#14532D;--teal:#159A86;--yellow:#FFD23F;--softy:#FFF3C4;--ink:#173a26;--bg1:#EAF7DE;--bg2:#F6FBEF}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
 color:var(--ink);line-height:1.7;background:radial-gradient(120% 55% at 50% -10%,#DCF3CB 0%,var(--bg1) 40%,var(--bg2) 100%);
 background-attachment:fixed;min-height:100vh;padding:20px 15px 46px}
.wrap{max-width:460px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--green),#26A64B);
 color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 22px rgba(47,162,75,.28);text-align:center}
.head img{width:40px;height:40px;flex:0 0 auto}
.head h1{font-size:22px;font-weight:900;letter-spacing:.02em}
.intro{background:#fff;border:1px solid #E4F1D9;border-radius:16px;padding:13px 15px;margin:14px 0 6px;
 font-size:13px;color:#3d5a45;box-shadow:0 6px 16px rgba(31,120,60,.08)}
.intro b{color:var(--green)}
.sechead{font-size:15px;font-weight:900;color:var(--teal);margin:18px 4px 2px;padding-left:8px;border-left:5px solid var(--yellow)}
details{background:#fff;border:1px solid #E4F1D9;border-radius:14px;margin:10px 0;overflow:hidden;box-shadow:0 5px 14px rgba(31,120,60,.08)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
 padding:14px 16px;font-size:16.5px;font-weight:800;color:var(--dgreen);background:#F4FBEE;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
.mk{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--yellow);position:relative}
.mk::before,.mk::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#7a5300;border-radius:2px}
.mk::before{width:12px;height:3px}.mk::after{width:3px;height:12px;transition:.15s}
details[open] .mk::after{height:0}
details[open] summary{background:#EAF7DE}
.body{padding:14px 16px;border-top:1px dashed #E1EFD6;font-size:15px;color:#2f4a38;line-height:1.85}
.body p{margin:2px 0}
.body img{max-width:100%;height:auto;display:block;margin:4px auto 8px;border-radius:8px;border:1px solid #eee;background:#fff}
.foot{text-align:center;margin-top:22px;color:#6b8a72;font-size:11.5px}
.foot b{color:var(--teal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
